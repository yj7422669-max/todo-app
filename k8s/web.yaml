apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: todo-web:kind
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: API_INTERNAL_URL
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: API_INTERNAL_URL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 5
          failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
  - name: http
    port: 3000
    targetPort: 3000
